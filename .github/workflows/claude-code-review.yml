name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [repack-main]
  workflow_dispatch:

jobs:
  claude-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'playerbot-v2-poc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: >-
            /code-review:code-review --comment
            ${{ github.repository }}/pull/${{ github.event.pull_request.number || '1' }}
            Review under CLAUDE.md. Treat this as Chipa MoP 5.4.8 PlayerBot V2.
            Focus on current gate defects, Core/module ownership, MODULES=0 regression,
            MODULES=1 integration, provenance, build/runtime safety, and unsupported PASS claims.
            Do not edit files or merge.
          claude_args: >-
            --allowedTools
            "Read,Glob,Grep,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
