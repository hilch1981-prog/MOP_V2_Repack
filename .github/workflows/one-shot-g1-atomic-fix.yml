name: One-shot G1 atomic portability fix

on:
  push:
    branches:
      - playerbot-v2-poc
    paths:
      - .github/workflows/one-shot-g1-atomic-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout active POC branch
        uses: actions/checkout@v4
        with:
          ref: playerbot-v2-poc
          fetch-depth: 0

      - name: Apply evidence-backed C++14 atomic initialization fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/server/game/World/World.cpp')
          text = path.read_text(encoding='utf-8-sig')
          replacements = {
              'std::atomic<bool> World::m_stopEvent = false;': 'std::atomic<bool> World::m_stopEvent{false};',
              'std::atomic<uint32> World::m_worldLoopCounter = 0;': 'std::atomic<uint32> World::m_worldLoopCounter{0};',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/server/game/World/World.cpp

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'PlayerBot V2 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/server/game/World/World.cpp
          git rm .github/workflows/one-shot-g1-atomic-fix.yml
          git commit -m 'build(cxx14): direct-initialize world atomics'
          git push origin HEAD:playerbot-v2-poc
