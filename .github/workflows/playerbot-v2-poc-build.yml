name: PlayerBot V2 POC Build

on:
  push:
    branches:
      - playerbot-v2-poc
  pull_request:
    branches:
      - repack-main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playerbot-v2-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: G1 build MODULES=${{ matrix.modules }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        modules: [0, 1]

    steps:
      - name: Checkout runtime and PlayerBot module
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            default-libmysqlclient-dev \
            libssl-dev \
            libboost-all-dev \
            libreadline-dev \
            zlib1g-dev \
            libbz2-dev \
            libjemalloc-dev

      - name: Record source baseline
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD | tee runtime-head.txt
          git submodule status --recursive | tee submodules.txt
          if [ "${{ matrix.modules }}" = "1" ]; then
            test "$(git -C modules/mod-playerbots rev-parse HEAD)" = "78bc93512f8c3b26175321e98eb0bede42917ce6"
          fi

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B "build-${{ matrix.modules }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSERVERS=1 \
            -DSCRIPTS=1 \
            -DTOOLS=0 \
            -DMODULES=${{ matrix.modules }} \
            2>&1 | tee "configure-${{ matrix.modules }}.log"

      - name: Verify module discovery
        if: matrix.modules == 1
        shell: bash
        run: |
          set -euxo pipefail
          grep -F "Configuring Chipa modules" "configure-${{ matrix.modules }}.log"
          grep -F "module: mod-playerbots" "configure-${{ matrix.modules }}.log"
          grep -F "Configured 1 Chipa module(s)" "configure-${{ matrix.modules }}.log"
          test -f "build-${{ matrix.modules }}/modules/ModulesLoader.cpp"
          grep -F "Addmod_playerbotsScripts" "build-${{ matrix.modules }}/modules/ModulesLoader.cpp"

      - name: Build whole server
        shell: bash
        run: |
          set -o pipefail
          cmake --build "build-${{ matrix.modules }}" --parallel 2 2>&1 | tee "build-${{ matrix.modules }}.log"

      - name: Verify worldserver output
        shell: bash
        run: |
          set -euxo pipefail
          find "build-${{ matrix.modules }}" -type f \( -name worldserver -o -name worldserver.exe \) -print | tee worldserver-files.txt
          test -s worldserver-files.txt

      - name: Upload G1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-modules-${{ matrix.modules }}-evidence
          if-no-files-found: warn
          path: |
            runtime-head.txt
            submodules.txt
            configure-${{ matrix.modules }}.log
            build-${{ matrix.modules }}.log
            worldserver-files.txt
            build-${{ matrix.modules }}/modules/ModulesLoader.cpp
